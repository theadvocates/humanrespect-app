# Deploys to Vercel from GitHub Actions.
#
# This exists instead of Vercel's native Git integration because the repo is
# owned by the `theadvocates` personal account while the Vercel project lives
# under `mikesertic`. GitHub only lets a personal account's owner install the
# Vercel App on its repos, so the native integration cannot be connected from
# this side. A token-based deploy sidesteps that entirely.
#
# Requires one repository secret: VERCEL_TOKEN
#   Create at https://vercel.com/account/settings/tokens
#   Add at   Settings -> Secrets and variables -> Actions -> New repository secret
#
# The org and project IDs below are identifiers, not credentials.

name: Deploy to Vercel

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_khp6kAHGexj27sbFSBXBxF3a
  VERCEL_PROJECT_ID: prj_zWDya4rw4Ggv1jiZpipjMOxQ7HhT
  VERCEL_SCOPE: mike-sertics-projects

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm 10 crashes resolving Nuxt 4's peer graph; .npmrc pins
      # legacy-peer-deps to work around it.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Surfaces token/scope problems directly. "Could not retrieve Project
      # Settings" otherwise gives no hint about which of the two is wrong.
      - name: Verify token access
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Shape only — never the value. A Vercel token is 60 characters.
          # The prefix check catches the common mistake of pasting a different
          # credential (sbp_ = Supabase, ghp_ = GitHub) into this secret.
          echo "token length: ${#TOKEN} (expected 60)"
          case "$TOKEN" in
            "")            echo "PROBLEM: secret is empty" ;;
            *[[:space:]]*) echo "PROBLEM: token contains whitespace" ;;
            sbp_*)         echo "PROBLEM: this is a Supabase token, not a Vercel one" ;;
            ghp_*|gho_*)   echo "PROBLEM: this is a GitHub token, not a Vercel one" ;;
            prj_*|team_*)  echo "PROBLEM: this is a Vercel ID, not an access token" ;;
            *)             echo "prefix does not match a known wrong-credential pattern" ;;
          esac
          echo "Authenticated as:"
          vercel whoami --token="$TOKEN"

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} \
            --scope=$VERCEL_SCOPE \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --scope=$VERCEL_SCOPE \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
